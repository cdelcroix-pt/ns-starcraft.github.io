<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0A0E16" />
<title>Starcraft — Score Console</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #0A0E16;
  }
  :root {
    --bg: #0A0E16;
    --panel: #11182A;
    --panel-edge: #223052;
    --grid-line: rgba(90, 130, 190, 0.14);
    --text-main: #E8EDF7;
    --text-dim: #7C8AAA;
    --amber: #F0A93B;
  }
  .console {
    font-family: ui-sans-serif, "Segoe UI", Roboto, sans-serif;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 100% 34px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 34px 100%,
      radial-gradient(circle at 50% 0%, #101a30 0%, var(--bg) 65%);
    color: var(--text-main);
    min-height: 100vh;
    padding: 18px;
    box-sizing: border-box;
  }
  .console * { box-sizing: border-box; }
  button, input { font-family: inherit; }

  .header { text-align: center; margin-bottom: 18px; }
  .header .kicker {
    font-size: 11px;
    letter-spacing: 0.32em;
    color: var(--text-dim);
    font-weight: 600;
  }
  .header h1 {
    margin: 4px 0 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.02em;
    background: linear-gradient(90deg, #7FD3FF, #E8EDF7 45%, #FF9E9E);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .table-badge {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 14px;
    border-radius: 20px;
    border: 1px solid var(--amber);
    color: var(--amber);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr clamp(160px, 30vw, 280px) 1fr;
    gap: 14px;
    max-width: 980px;
    margin: 0 auto;
    align-items: start;
  }
  @media (max-width: 600px) {
    .layout { grid-template-columns: 1fr; }
    .mission { order: -1; }
  }
  @media (min-width: 601px) and (max-width: 1100px) {
    .panel { padding: 12px; }
    .player-head { margin-bottom: 10px; }
    .faction-id-row { grid-template-columns: 1fr; gap: 6px; margin-bottom: 10px; }
    .param-pair { grid-template-columns: 1fr; gap: 6px; margin-bottom: 10px; }
    .track { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .score-row { margin: 4px 0 12px; }
    .section-label { margin-bottom: 4px; }
  }

  .panel {
    background: linear-gradient(180deg, var(--panel), #0D1424);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    padding: 16px;
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 10px;
    padding: 1px;
    background: linear-gradient(135deg, var(--edge-color, transparent), transparent 40%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .player-panel { --edge-color: var(--p-color); }

  .player-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .player-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--p-color);
    box-shadow: 0 0 10px var(--p-color);
    flex-shrink: 0;
  }
  .player-name {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.06em;
    background: none;
    border: none;
    color: var(--text-main);
    border-bottom: 1px dashed transparent;
    padding: 0;
    width: 100%;
  }
  .player-name:hover, .player-name:focus { border-bottom-color: var(--text-dim); outline: none; }
  .first-badge {
    font-size: 11px;
    letter-spacing: 0.1em;
    font-weight: 700;
    color: var(--amber);
    border: 1px solid var(--amber);
    border-radius: 5px;
    padding: 5px 9px;
    white-space: nowrap;
    background: transparent;
    cursor: pointer;
  }
  .first-badge.inactive { color: var(--text-dim); border-color: var(--panel-edge); }

  .section-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--text-dim);
    font-weight: 700;
    margin-bottom: 6px;
  }

  .score-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 6px 0 18px; }
  .score-value {
    font-variant-numeric: tabular-nums;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
    font-size: 40px;
    font-weight: 700;
    min-width: 64px;
    text-align: center;
    color: var(--p-color);
    text-shadow: 0 0 18px color-mix(in srgb, var(--p-color) 55%, transparent);
  }

  .track {
    display: grid;
    grid-template-columns: repeat(9, minmax(0, 1fr));
    gap: 5px;
    margin-bottom: 16px;
  }
  .pip {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px;
    border-radius: 6px;
    border: 1px solid var(--panel-edge);
    background: #0D1424;
    color: var(--text-dim);
    cursor: pointer;
  }
  .pip.filled { background: var(--p-color); border-color: var(--p-color); color: #05070C; font-weight: 700; }

  .mini-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .mini-count {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 18px;
    font-weight: 700;
    min-width: 26px;
    text-align: center;
  }
  .mini-btn {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: 1px solid var(--panel-edge);
    background: #0D1424;
    color: var(--text-main);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
  }
  .mini-btn:hover { background: #182238; }

  .stat-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .stat-count {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 26px;
    font-weight: 700;
    min-width: 32px;
    text-align: center;
  }

  .select-wrap { position: relative; margin-bottom: 14px; }
  .select-field {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background: #0D1424;
    color: var(--text-main);
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    padding: 8px 30px 8px 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .select-field:hover { background: #182238; }
  .select-field:focus { outline: none; border-color: var(--text-dim); }
  .select-wrap::after {
    content: "▾";
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
    font-size: 11px;
  }

  .param-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .param-pair .param-block { margin-bottom: 0; }

  .faction-id-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .faction-id-row .select-wrap { margin-bottom: 0; }
  .id-field {
    width: 100%;
    background: #0D1424;
    color: var(--text-main);
    border: 1px solid var(--panel-edge);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 600;
  }
  .id-field::placeholder { color: var(--text-dim); font-weight: 400; }
  .id-field:focus { outline: none; border-color: var(--text-dim); }

  .mission { padding-top: 20px; text-align: center; }
  .round-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--text-dim);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .round-pips { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
  .round-pip {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--panel-edge);
    background: #0D1424;
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .round-pip.active {
    background: var(--amber);
    border-color: var(--amber);
    color: #05070C;
    box-shadow: 0 0 12px rgba(240,169,59,0.6);
  }
  .advance-btn {
    width: 100%;
    padding: 9px 0;
    border-radius: 8px;
    border: 1px solid var(--amber);
    background: transparent;
    color: var(--amber);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.08em;
    cursor: pointer;
    margin-bottom: 22px;
  }
  .advance-btn:hover { background: rgba(240,169,59,0.1); }
  .advance-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .supply-max-block { margin: 2px 0 20px; }
  .supply-max-value {
    font-variant-numeric: tabular-nums;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
    font-size: 34px;
    font-weight: 700;
    color: var(--amber);
    text-shadow: 0 0 18px rgba(240, 169, 59, 0.35);
  }

  .param-block { margin-bottom: 16px; }

  .reset-zone { margin-top: 8px; }
  .reset-btn {
    width: 100%;
    padding: 8px 0;
    border-radius: 8px;
    border: 1px solid #4a2323;
    background: transparent;
    color: #E88;
    font-size: 11px;
    letter-spacing: 0.06em;
    font-weight: 700;
    cursor: pointer;
  }
  .reset-btn:hover { background: rgba(232,90,90,0.08); }
  .reset-confirm { display: flex; gap: 6px; }
  .reset-confirm button {
    flex: 1;
    padding: 8px 0;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--panel-edge);
    background: #0D1424;
    color: var(--text-main);
  }
  .reset-confirm .yes { border-color: #E85858; color: #E88; }

  .report-btn {
    width: 100%;
    padding: 9px 0;
    border-radius: 8px;
    border: 1px solid var(--panel-edge);
    background: #182238;
    color: var(--text-main);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.08em;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .report-btn:hover { background: #1f2b47; }

  .report-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 15, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }
  .report-card {
    background: #ffffff;
    color: #1a1a1a;
    width: 100%;
    max-width: 440px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 10px;
    padding: 28px 26px;
    font-family: ui-sans-serif, "Segoe UI", Roboto, sans-serif;
  }
  .report-card h2 { margin: 0 0 2px; font-size: 20px; font-weight: 800; letter-spacing: 0.01em; }
  .report-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 18px;
  }
  .report-logo {
    width: 82px;
    height: auto;
    flex-shrink: 0;
  }
  .report-footer {
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid #ddd;
    font-size: 11px;
    color: #777;
    text-align: center;
    letter-spacing: 0.02em;
  }
  .report-result { font-size: 19px; font-weight: 800; color: #1a1a1a; text-align: center; padding: 2px 0; }
  .report-meta { font-size: 12px; color: #777; }
  .report-setup { font-size: 13px; line-height: 1.7; margin-bottom: 16px; }
  .report-setup strong { color: #1a1a1a; }
  .report-divider { border: none; border-top: 1px solid #ddd; margin: 18px 0; }
  .report-players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .report-player-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .report-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .report-player-name { font-weight: 800; font-size: 15px; }
  .report-player-faction { font-size: 12px; color: #777; margin-bottom: 6px; }
  .report-list-id { font-size: 11px; color: #888; margin-bottom: 6px; }
  .report-score {
    font-size: 26px;
    font-weight: 800;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    margin: 2px 0 6px;
  }
  .report-breakdown { font-size: 12px; color: #555; line-height: 1.5; }
  .report-points { font-weight: 700; color: #1a1a1a; margin-top: 2px; }
  .report-actions { display: flex; gap: 8px; margin-top: 22px; }
  .report-actions button {
    flex: 1;
    padding: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    background: #f4f4f4;
    color: #1a1a1a;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
  }
  .report-actions .primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

  .game-name-field {
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.04em;
    background: none;
    border: none;
    color: var(--text-main);
    border-bottom: 1px dashed transparent;
    padding: 0;
    width: 100%;
    text-align: center;
    margin-bottom: 14px;
    cursor: text;
  }
  .game-name-field.placeholder { color: var(--text-dim); }
  .game-name-field:hover, .game-name-field:focus { border-bottom-color: var(--text-dim); outline: none; }

  .outcome-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 15, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }
  .outcome-card {
    background: linear-gradient(180deg, var(--panel), #0D1424);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    padding: 24px 22px;
    width: 100%;
    max-width: 360px;
    color: var(--text-main);
  }
  .outcome-card h3 { margin: 0 0 16px; font-size: 15px; font-weight: 700; text-align: center; }
  .outcome-options { display: flex; flex-direction: column; gap: 8px; }
  .outcome-option-btn {
    width: 100%;
    padding: 10px 0;
    border-radius: 8px;
    border: 1px solid var(--panel-edge);
    background: #0D1424;
    color: var(--text-main);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .outcome-option-btn:hover { background: #182238; }
  .outcome-cancel {
    width: 100%;
    margin-top: 14px;
    padding: 8px 0;
    border-radius: 8px;
    border: 1px solid var(--panel-edge);
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
  }

  @media print {
    .console { display: none !important; }
    .report-overlay {
      position: static !important;
      background: none !important;
      padding: 0 !important;
      display: block !important;
    }
    .report-card {
      position: static !important;
      max-width: 600px !important;
      max-height: none !important;
      overflow: visible !important;
      margin: 0 auto !important;
    }
    .no-print { display: none !important; }
  }
</style>
</head>

      const p1Points = s1 >= s2 ? result.winner : result.loser;
      const p2Points = s1 >= s2 ? result.loser : result.winner;
      return { category: result.name, points: { [p1.id]: p1Points, [p2.id]: p2Points } };
    }

    const rule = FIXED_OUTCOME_POINTS[state.reportOutcome];
    if (!rule || state.reportConcernedPlayerId == null) return null;
    const opponentId = state.reportConcernedPlayerId === p1.id ? p2.id : p1.id;
    return {
      category: null,
      points: { [state.reportConcernedPlayerId]: rule.concerned, [opponentId]: rule.opponent },
    };
  }

  function sendReportToSheet() {
    if (!GOOGLE_SHEETS_ENDPOINT_URL) return;
    const result = computeBattleResult();
    const resultLabel = result && result.category ? result.category : outcomeLabel(state.reportOutcome);
    const [p1, p2] = state.players;
    const p1pts = result ? result.points[p1.id] : null;
    const p2pts = result ? result.points[p2.id] : null;

    const payload = {
      timestamp: new Date().toISOString(),
      table: tableNumber || "",
      game: state.gameName || "",
      round: state.round,
      result: resultLabel,
      player1Name: p1.name,
      player1Faction: p1.faction || "",
      player1ListId: p1.listId || "",
      player1Score: p1.missionVP + p1.destroyed,
      player1MissionVP: p1.missionVP,
      player1Destroyed: p1.destroyed,
      player1Points: p1pts ? `${p1pts.mp} MP · ${p1pts.tp} TP` : "",
      player2Name: p2.name,
      player2Faction: p2.faction || "",
      player2ListId: p2.listId || "",
      player2Score: p2.missionVP + p2.destroyed,
      player2MissionVP: p2.missionVP,
      player2Destroyed: p2.destroyed,
      player2Points: p2pts ? `${p2pts.mp} MP · ${p2pts.tp} TP` : "",
      missionCard: state.missionCard,
      deployment: state.deployment,
      startSupply: state.startSupply,
      supplyGrowth: state.supplyGrowth,
    };

    fetch(GOOGLE_SHEETS_ENDPOINT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    }).catch(() => {
      // Envoi best-effort : une panne réseau ne doit pas bloquer l'usage de la console.
    });
  }

  function buildReportText() {
    const battleResult = state.reportStep === "report" ? computeBattleResult() : null;
    const resultLabel = battleResult && battleResult.category ? battleResult.category : outcomeLabel(state.reportOutcome);
    const lines = [
      `RAPPORT DE BATAILLE${state.gameName ? " - " + state.gameName : ""}`,
      `Round ${state.round}`,
      ...(tableNumber ? [`Table : ${tableNumber}`] : []),
      "",
      `Résultat : ${resultLabel}`,
      "",
      `Mission Card : ${state.missionCard || "—"}`,
      `Deployment : ${state.deployment || "—"}`,
      `Start Supply : ${state.startSupply}    Supply Growth : ${state.supplyGrowth}`,
      "",
    ];
    state.players.forEach((p) => {
      lines.push(`${p.name} — ${p.faction || "Faction non choisie"}`);
      if (p.listId) lines.push(`ID Liste : ${p.listId}`);
      lines.push(`Score : ${p.missionVP + p.destroyed} VP`);
      lines.push(`  Mission VP : ${p.missionVP}`);
      lines.push(`  Destroyed Supply : ${p.destroyed}`);
      if (battleResult) {
        const pts = battleResult.points[p.id];
        lines.push(`  ${pts ? `${pts.mp} MP · ${pts.tp} TP` : "—"}`);
      }
      lines.push("");
    });
    lines.push(`A l'Assaut de Bruay 2026 - ${formatReportDate(state.reportTimestamp)}`);
    return lines.join("\n").trim();
  }

  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  function copyReport() {
    const text = buildReportText();
    const done = () => {
      state.copied = true;
      render();
      setTimeout(() => {
        state.copied = false;
        render();
      }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => { fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text);
      done();
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function renderPlayerPanel(p, idx) {
    const order = idx === 0 ? 0 : 2;
    const editing = state.editingName === p.id;
    const nameField = editing
      ? `<input class="player-name" id="name-input-${p.id}" value="${escapeHtml(p.name)}" />`
      : `<button class="player-name" style="text-align:left; cursor:text;" data-action="editName" data-id="${p.id}">${escapeHtml(p.name)}</button>`;

    const pips = SUPPLY_STEPS.map((label, i) => `
      <div class="pip ${p.supply === i ? "filled" : ""}" data-action="supply" data-id="${p.id}" data-index="${i}">${label}</div>
    `).join("");

    return `
      <div class="panel player-panel" style="--p-color:${p.color}; order:${order}">
        <div class="player-head">
          <span class="player-dot"></span>
          ${nameField}
          <button class="first-badge ${state.firstPlayer !== p.id ? "inactive" : ""}" data-action="firstPlayer" data-id="${p.id}" title="Marquer comme premier joueur">1ST</button>
        </div>

        <div class="faction-id-row">
          <div class="select-wrap">
            <select class="select-field" data-action="faction" data-id="${p.id}">
              <option value="" ${p.faction === "" ? "selected" : ""} disabled>— Choisir —</option>
              <option value="Protoss" ${p.faction === "Protoss" ? "selected" : ""}>Protoss</option>
              <option value="Terran" ${p.faction === "Terran" ? "selected" : ""}>Terran</option>
              <option value="Zerg" ${p.faction === "Zerg" ? "selected" : ""}>Zerg</option>
            </select>
          </div>
          <input class="id-field" type="text" id="listid-input-${p.id}" placeholder="ID LISTE" value="${escapeHtml(p.listId || "")}" />
        </div>

        <div class="section-label" style="text-align:center">SCORE</div>
        <div class="score-row">
          <span class="score-value">${p.missionVP + p.destroyed}</span>
        </div>

        <div class="section-label">ACTIVE SUPPLY</div>
        <div class="track">${pips}</div>

        <div class="section-label">MISSION VP</div>
        <div class="stat-row">
          <button class="mini-btn" data-action="bump" data-id="${p.id}" data-field="missionVP" data-delta="-1">–</button>
          <span class="stat-count">${p.missionVP}</span>
          <button class="mini-btn" data-action="bump" data-id="${p.id}" data-field="missionVP" data-delta="1">+</button>
        </div>

        <div class="section-label">DESTROYED SUPPLY</div>
        <div class="stat-row">
          <button class="mini-btn" data-action="bump" data-id="${p.id}" data-field="destroyed" data-delta="-1">–</button>
          <span class="stat-count">${p.destroyed}</span>
          <button class="mini-btn" data-action="bump" data-id="${p.id}" data-field="destroyed" data-delta="1">+</button>
        </div>
      </div>
    `;
  }

  function renderMissionPanel() {
    const roundPips = [1, 2, 3, 4, 5].map((r) => `
      <div class="round-pip ${state.round === r ? "active" : ""}" data-action="round" data-round="${r}">${r}</div>
    `).join("");

    const resetZone = state.confirmReset
      ? `<div class="reset-confirm">
          <button data-action="resetCancel">ANNULER</button>
          <button class="yes" data-action="resetConfirm">CONFIRMER</button>
        </div>`
      : `<button class="reset-btn" data-action="resetRequest">RÉINITIALISER LA PARTIE</button>`;

    return `
      <div class="panel mission" style="order:1">
        ${state.editingGameName
          ? `<input class="game-name-field" id="game-name-input" value="${escapeHtml(state.gameName)}" placeholder="NOM DE LA PARTIE" />`
          : `<button class="game-name-field ${state.gameName ? "" : "placeholder"}" data-action="editGameName">${escapeHtml(state.gameName || "NOM DE LA PARTIE")}</button>`}

        <div class="round-label">ROUND</div>
        <div class="round-pips">${roundPips}</div>

        <div class="section-label">SUPPLY MAX</div>
        <div class="supply-max-block">
          <span class="supply-max-value">${supplyMax()}</span>
        </div>

        <button class="advance-btn" data-action="advanceRound" ${state.round >= 5 ? "disabled" : ""}>ROUND SUIVANT →</button>

        <div class="param-pair">
          <div class="param-block">
            <div class="section-label">MISSION CARD</div>
            <div class="select-wrap">
              <select class="select-field" data-action="missionCard">
                <option value="" ${state.missionCard === "" ? "selected" : ""} disabled>— Choisir —</option>
                ${MISSION_CARDS.map((m) => `<option value="${m}" ${state.missionCard === m ? "selected" : ""}>${m}</option>`).join("")}
              </select>
            </div>
          </div>

          <div class="param-block">
            <div class="section-label">DEPLOYMENT</div>
            <div class="select-wrap">
              <select class="select-field" data-action="deployment">
                <option value="" ${state.deployment === "" ? "selected" : ""} disabled>— Choisir —</option>
                ${DEPLOYMENTS.map((d) => `<option value="${d}" ${state.deployment === d ? "selected" : ""}>${d}</option>`).join("")}
              </select>
            </div>
          </div>
        </div>

        <div class="param-pair">
          <div class="param-block">
            <div class="section-label">START SUPPLY</div>
            <div class="mini-row">
              <button class="mini-btn" data-action="param" data-field="startSupply" data-delta="-1">–</button>
              <span class="mini-count">${state.startSupply}</span>
              <button class="mini-btn" data-action="param" data-field="startSupply" data-delta="1">+</button>
            </div>
          </div>

          <div class="param-block">
            <div class="section-label">SUPPLY GROWTH</div>
            <div class="mini-row">
              <button class="mini-btn" data-action="param" data-field="supplyGrowth" data-delta="-1">–</button>
              <span class="mini-count">${state.supplyGrowth}</span>
              <button class="mini-btn" data-action="param" data-field="supplyGrowth" data-delta="1">+</button>
            </div>
          </div>
        </div>

        <button class="report-btn" data-action="reportOpen">RAPPORT DE BATAILLE</button>

        <div class="reset-zone">${resetZone}</div>
      </div>
    `;
  }

  function renderOutcome() {
    if (state.reportStep !== "outcome") return "";
    const buttons = REPORT_OUTCOMES.map((o) => `
      <button class="outcome-option-btn" data-action="chooseOutcome" data-key="${o.key}">${o.label}</button>
    `).join("");

    return `
      <div class="outcome-overlay" data-action="reportClose">
        <div class="outcome-card" data-action="outcomeCardNoop">
          <h3>Quel est le résultat de la partie ?</h3>
          <div class="outcome-options">${buttons}</div>
          <button class="outcome-cancel" data-action="reportClose">Annuler</button>
        </div>
      </div>
    `;
  }

  function renderConcerned() {
    if (state.reportStep !== "concerned") return "";
    const buttons = state.players.map((p) => `
      <button class="outcome-option-btn" data-action="chooseConcerned" data-id="${p.id}">${escapeHtml(p.name)}</button>
    `).join("");

    return `
      <div class="outcome-overlay" data-action="reportClose">
        <div class="outcome-card" data-action="outcomeCardNoop">
          <h3>Quel joueur est concerné ?</h3>
          <div class="outcome-options">${buttons}</div>
          <button class="outcome-cancel" data-action="reportClose">Annuler</button>
        </div>
      </div>
    `;
  }

  function renderReport() {
    if (state.reportStep !== "report") return "";

    const battleResult = computeBattleResult();
    const resultLabel = battleResult && battleResult.category ? battleResult.category : outcomeLabel(state.reportOutcome);

    const rows = state.players.map((p) => {
      const pts = battleResult ? battleResult.points[p.id] : null;
      return `
        <div class="report-player">
          <div class="report-player-head">
            <span class="report-dot" style="background:${p.color}"></span>
            <span class="report-player-name">${escapeHtml(p.name)}</span>
          </div>
          <div class="report-player-faction">${escapeHtml(p.faction || "Faction non choisie")}</div>
          ${p.listId ? `<div class="report-list-id">ID Liste : ${escapeHtml(p.listId)}</div>` : ""}
          <div class="report-score">${p.missionVP + p.destroyed} VP</div>
          <div class="report-breakdown">Mission VP : ${p.missionVP}</div>
          <div class="report-breakdown">Destroyed Supply : ${p.destroyed}</div>
          ${battleResult ? `<div class="report-points">${pts ? `${pts.mp} MP · ${pts.tp} TP` : "—"}</div>` : ""}
        </div>
      `;
    }).join("");

    return `
      <div class="report-overlay" data-action="reportClose">
        <div class="report-card" data-action="reportCardNoop">
          <div class="report-header">
            <div>
              <h2>Rapport de bataille${state.gameName ? " - " + escapeHtml(state.gameName) : ""}</h2>
              <div class="report-meta">Round ${state.round} — StarCraft: The Board Game</div>
            </div>
            <img src="${NORD_STRATEGIE_LOGO}" alt="Nord-Stratégie" class="report-logo" />
          </div>

          <div class="report-setup">
            ${tableNumber ? `<div><strong>Table :</strong> ${escapeHtml(tableNumber)}</div>` : ""}
            <div><strong>Mission Card :</strong> ${escapeHtml(state.missionCard || "—")}</div>
            <div><strong>Deployment :</strong> ${escapeHtml(state.deployment || "—")}</div>
            <div><strong>Start Supply :</strong> ${state.startSupply} &nbsp;&nbsp; <strong>Supply Growth :</strong> ${state.supplyGrowth}</div>
          </div>

          <hr class="report-divider" />
          <div class="report-result">Résultat : ${resultLabel}</div>
          <hr class="report-divider" />

          <div class="report-players">${rows}</div>

          <div class="report-footer">A l'Assaut de Bruay 2026 - ${formatReportDate(state.reportTimestamp)}</div>

          <div class="report-actions no-print">
            <button data-action="reportClose">Fermer</button>
            <button data-action="reportCopy">${state.copied ? "Copié !" : "Copier"}</button>
            <button class="primary" data-action="reportPrint">Imprimer / PDF</button>
          </div>
        </div>
      </div>
    `;
  }

  function render() {
    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="console">
        <div class="header">
          <div class="kicker">TABLETOP MINIATURES GAME</div>
          <h1>STARCRAFT — SCORE CONSOLE</h1>
          ${tableNumber ? `<div class="table-badge">TABLE ${tableNumber}</div>` : ""}
        </div>
        <div class="layout">
          ${state.players.map((p, idx) => renderPlayerPanel(p, idx)).join("")}
          ${renderMissionPanel()}
        </div>
      </div>
      ${renderOutcome()}
      ${renderConcerned()}
      ${renderReport()}
    `;

    if (state.editingGameName) {
      const gnInput = document.getElementById("game-name-input");
      if (gnInput) {
        gnInput.focus();
        gnInput.setSelectionRange(gnInput.value.length, gnInput.value.length);
        gnInput.addEventListener("input", (e) => {
          const start = e.target.selectionStart;
          const end = e.target.selectionEnd;
          const upper = e.target.value.toUpperCase();
          state.gameName = upper;
          if (e.target.value !== upper) {
            e.target.value = upper;
            e.target.setSelectionRange(start, end);
          }
        });
        gnInput.addEventListener("blur", () => {
          state.editingGameName = false;
          render();
        });
        gnInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") e.target.blur();
        });
      }
    }

    if (state.editingName !== null) {
      const input = document.getElementById(`name-input-${state.editingName}`);
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
        input.addEventListener("input", (e) => {
          const start = e.target.selectionStart;
          const end = e.target.selectionEnd;
          const upper = e.target.value.toUpperCase();
          updatePlayer(state.editingName, { name: upper });
          if (e.target.value !== upper) {
            e.target.value = upper;
            e.target.setSelectionRange(start, end);
          }
        });
        input.addEventListener("blur", () => {
          state.editingName = null;
          render();
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") e.target.blur();
        });
      }
    }

    state.players.forEach((p) => {
      const idInput = document.getElementById(`listid-input-${p.id}`);
      if (idInput) {
        idInput.addEventListener("input", (e) => {
          const start = e.target.selectionStart;
          const end = e.target.selectionEnd;
          const upper = e.target.value.toUpperCase();
          updatePlayer(p.id, { listId: upper });
          if (e.target.value !== upper) {
            e.target.value = upper;
            e.target.setSelectionRange(start, end);
          }
        });
      }
    });
  }

  document.getElementById("app").addEventListener("change", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;

    switch (action) {
      case "faction":
        updatePlayer(Number(el.dataset.id), { faction: el.value });
        render();
        break;
      case "missionCard":
        state.missionCard = el.value;
        render();
        break;
      case "deployment":
        state.deployment = el.value;
        render();
        break;
    }
  });

  document.getElementById("app").addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;

    switch (action) {
      case "editName":
        state.editingName = Number(el.dataset.id);
        render();
        break;
      case "firstPlayer":
        state.firstPlayer = Number(el.dataset.id);
        render();
        break;
      case "supply":
        updatePlayer(Number(el.dataset.id), { supply: Number(el.dataset.index) });
        render();
        break;
      case "bump":
        bump(Number(el.dataset.id), el.dataset.field, Number(el.dataset.delta), 0, 99);
        render();
        break;
      case "round":
        state.round = Number(el.dataset.round);
        render();
        break;
      case "advanceRound":
        if (state.round < 5) {
          state.round = Math.min(5, state.round + 1);
          state.firstPlayer = state.firstPlayer === 1 ? 2 : 1;
        }
        render();
        break;
      case "param":
        state[el.dataset.field] = clamp(state[el.dataset.field] + Number(el.dataset.delta), 0, 999);
        render();
        break;
      case "resetRequest":
        state.confirmReset = true;
        render();
        break;
      case "resetCancel":
        state.confirmReset = false;
        render();
        break;
      case "resetConfirm":
        resetGame();
        render();
        break;
      case "editGameName":
        state.editingGameName = true;
        render();
        break;
      case "reportOpen":
        state.reportTimestamp = new Date();
        state.reportOutcome = "";
        state.reportConcernedPlayerId = null;
        state.reportStep = "outcome";
        render();
        break;
      case "chooseOutcome":
        state.reportOutcome = el.dataset.key;
        state.reportConcernedPlayerId = null;
        state.reportStep = NEEDS_CONCERNED_PLAYER.includes(el.dataset.key) ? "concerned" : "report";
        if (state.reportStep === "report") sendReportToSheet();
        render();
        break;
      case "chooseConcerned":
        state.reportConcernedPlayerId = Number(el.dataset.id);
        state.reportStep = "report";
        sendReportToSheet();
        render();
        break;
      case "reportClose":
        state.reportStep = "closed";
        render();
        break;
      case "reportCardNoop":
      case "outcomeCardNoop":
        break;
      case "reportCopy":
        copyReport();
        break;
      case "reportPrint":
        window.print();
        break;
    }
  });

  render();
})();
</script>
</body>
</html>
